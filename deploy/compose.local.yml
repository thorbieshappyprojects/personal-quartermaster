# Local trial of the production stack (no tunnel, image built locally):
#   docker compose -f deploy/compose.yml -f deploy/compose.local.yml --env-file deploy/local.env up -d --build
name: personal-quartermaster-local

services:
  app:
    image: personal-quartermaster:local
    build: { context: .., args: { GIT_COMMIT: local } }
    env_file: !reset []
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pq:${POSTGRES_PASSWORD}@db:5432/pq
      CF_ACCESS_TEAM_DOMAIN: local-test.cloudflareaccess.com
      CF_ACCESS_AUD: local-test-audience
  jobs:
    image: personal-quartermaster:local
    env_file: !reset []
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pq:${POSTGRES_PASSWORD}@db:5432/pq
      CF_ACCESS_TEAM_DOMAIN: local-test.cloudflareaccess.com
      CF_ACCESS_AUD: local-test-audience
  tunnel:
    profiles: [disabled]
