name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Tags
        id: tags
        run: |
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pq:candidate
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Leak check (image contents)
        env:
          LEAK_DOMAINS: ${{ secrets.LEAK_DOMAINS }}
        run: |
          mkdir -p /tmp/img
          cid=$(docker create pq:candidate)
          docker export "$cid" | tar -x -C /tmp/img app
          docker rm "$cid" >/dev/null
          node scripts/leak-check.mjs --emails /tmp/img/app
      - name: Image runs as non-root and refuses to start without the gate
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' pq:candidate)" = node
          set +e
          docker run --rm -e DATABASE_URL=postgres://x@127.0.0.1/x pq:candidate; code=$?
          test "$code" = 2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          for t in latest "${{ steps.tags.outputs.short }}" "${{ github.sha }}"; do
            docker tag pq:candidate "$IMAGE:$t"
            docker push -q "$IMAGE:$t"
          done
