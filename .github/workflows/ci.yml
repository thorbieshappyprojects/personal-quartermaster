name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54329/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Leak check (repository and fixtures)
        env:
          LEAK_DOMAINS: ${{ secrets.LEAK_DOMAINS }}
        run: |
          git ls-files -z | xargs -0 node scripts/leak-check.mjs
          fixtures=$(git ls-files | grep '/fixtures/' || true)
          if [ -n "$fixtures" ]; then echo "$fixtures" | xargs node scripts/leak-check.mjs --emails; fi

      - name: Shellcheck
        run: shellcheck -x -S warning deploy/*.sh scripts/*.sh

      - name: Compose file is valid
        run: |
          touch deploy/.env
          POSTGRES_PASSWORD=x TUNNEL_TOKEN=x docker compose -f deploy/compose.yml config --quiet
          rm deploy/.env

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Playwright smoke (phone and desktop)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
